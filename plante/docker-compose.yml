version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: plante_user
      POSTGRES_PASSWORD: example_password
      POSTGRES_DB: plante_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    image: python:3.11-slim
    depends_on:
      - db
    working_dir: /app
    volumes:
      - ./:/app:rw
      - uploads:/app/backend/uploads
    environment:
      # Utilise le service 'db' comme hôte pour PostgreSQL
      DATABASE_URL: postgresql://plante_user:example_password@db:5432/plante_db
    ports:
      - "8000:8000"
    command: bash -c "pip install --upgrade pip && pip install -r backend/requirements.txt && python backend/models.py && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
  uploads:
