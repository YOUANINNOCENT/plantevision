services:
  - type: web
    name: plante-backend
    runtime: python
    rootDir: plante/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PLANTNET_API_KEY
        sync: false
